steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/queuebee-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/queuebee-backend:latest'
      - './backend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/queuebee-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/queuebee-backend:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'queuebee-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/queuebee-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8001'
      - '--set-env-vars'
      - 'MONGO_URL=${_MONGO_URL}'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/queuebee-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/queuebee-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _MONGO_URL: 'mongodb+srv://your-username:your-password@your-cluster.mongodb.net/queuebee'